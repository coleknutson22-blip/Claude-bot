# crypto_edge_bot_v1 -- parameters
#
# Secrets do NOT belong here. Put TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in
# .env (see .env.example). This file is safe to commit; .env is not.
#
# Every value below is the default the code ships with. Changing a strategy
# parameter changes the strategy fingerprint, so trades taken before and after
# the change stay separable in the research database.

[exchange]
name = "binance"          # any ccxt-supported venue; public endpoints only
# THE quote currency. Every market symbol in the system is built from this one
# value -- the BTC regime reference, always_include, the universe, sizing,
# reporting. Override per run with --quote / CRYPTO_EDGE_QUOTE; the effective
# venue is then displayed everywhere as e.g. "kraken/USD".
# Kraken's deep spot books are USD, not USDT.
quote = "USDT"
rate_limit_ms = 250
# Candles per REQUEST -- a paging hint, not the total history fetched. Venues
# cap responses and some ignore this entirely (Kraken's OHLC endpoint disregards
# it and returns at most 720). The feed pages with `since` until it holds the
# depth the universe filters require, which is DERIVED from those filters:
#   max(min_candles_1h, warmup_bars, min_market_age_days in bars)
# At the shipped settings that is 1085 x 1h bars. Fetching less would not make
# the filters stricter -- it would make them unsatisfiable, rejecting every
# symbol for history it was never given the chance to supply.
ohlcv_limit = 300
# Closed candles held in memory per symbol+timeframe. A closed candle never
# changes, so no request is made until a new one actually closes. 0 disables.
ohlcv_cache_bars = 2000
max_history_bars = 2000   # safety ceiling on paging; startup FAILS if this is
                          # below what the filters need, rather than silently
                          # rejecting everything

[universe]
# "Top 200" means the top ~200 legitimate crypto ASSETS by market capitalisation
# -- a venue-independent definition -- intersected with what this exchange
# actually lists. It is NOT the exchange's own highest-volume markets: that list
# is a snapshot of where speculation is pointed today, changes with fee
# campaigns and listing promotions, and makes backtests irreproducible.
# See crypto_edge/data/broad_universe.py.
broad_source = "coingecko"        # "coingecko" | "static" | "none"
broad_limit = 200                 # size of the broad asset list
broad_min_assets = 50             # fewer than this means the provider is broken
broad_refresh_hours = 12          # market caps move slowly
broad_max_cache_age_hours = 168   # a week-old cached universe stops being usable
broad_static_assets = []          # only used when broad_source = "static"
# Ticker symbols are NOT globally unique -- unrelated projects reuse them. We
# scan further down the ranking than we trade so a ticker shared with a
# lower-ranked asset is visible as a collision; a colliding ticker is REFUSED
# rather than guessed at, and is reported by `cli verify-live`.
broad_collision_scan_limit = 1000
# Deterministic disambiguation: exchange base symbol -> provider asset id.
# Consulted before anything else, so it also rescues a ticker that would
# otherwise be refused. Example:
#   [universe.broad_symbol_overrides]
#   GRT = "the-graph"
broad_symbol_overrides = {}

# --- market age, established INDEPENDENTLY of indicator history -----------
# A venue's OHLCV cap is PER TIMEFRAME. Kraken's 720-bar limit is 30 days at 1h
# but 720 days at 1d, so asking about age at 1h could never evidence a 45-day
# gate -- every market, however old, read as "too new". Age now asks at a coarse
# resolution where reach is cheap, while the indicators keep asking at 1h where
# density matters. Sources are tried in order: venue listing metadata, coarse
# OHLCV, stored earlier observation, provider asset history. If none answers,
# the market FAILS CLOSED rather than being assumed old enough.
age_probe_timeframe = "1d"
age_probe_bars = 400      # 400 days of reach against a 45-day gate
age_cache_hours = 24      # age changes slowly; do not re-probe every cycle
# With neither a live nor a usable cached broad universe, NEW ENTRIES STOP.
# Open positions keep being managed regardless -- the ranking provider is never
# allowed to become a single point of failure for risk already on the books.
require_broad_universe = true

top_n = 200               # keep the top 200 of the broad asset ranking
max_tradable = 40         # then hand at most 40 to the strategy each cycle
refresh_minutes = 360
# 24h NOTIONAL VOLUME IN THE SELECTED QUOTE CURRENCY (so USD notional on a USD
# venue, USDT notional on a USDT venue). Not converted to dollars -- the quote
# currency IS the unit of account for everything else here too.
min_dollar_volume_24h = 5_000_000.0
max_spread_bps = 15.0     # a wide book eats the edge before the trade starts
min_candles_1h = 400      # need history for a 200-EMA plus warm-up
min_market_age_days = 45  # brand-new listings behave nothing like mature markets
min_atr_pct = 0.8         # too quiet: no move to capture
max_atr_pct = 25.0        # too wild: stop distance makes position size meaningless
exclude_stablecoins = true
exclude_leveraged = true  # 3L/3S/UP/DOWN tokens decay; they are not the asset
exclude_wrapped = true    # WBTC/stETH duplicate exposure you may already hold
# BASE assets, not pairs. Each is completed with the quote currency above, so
# switching to USD yields BTC/USD and ETH/USD automatically.
always_include_bases = ["BTC", "ETH"]
blacklist = []

[strategy]
name = "trend_breakout"
version = "1.0.0"
entry_timeframe = "1h"
regime_timeframe = "4h"
donchian_lookback = 48    # breakout reference EXCLUDES the current bar
ema_fast = 20
ema_slow = 50
ema_trend = 200
atr_period = 14
adx_period = 14
rsi_period = 14
min_adx = 20.0            # below this the "trend" is chop
max_rsi = 78.0            # do not buy a blow-off
min_rel_volume = 1.2      # a breakout on no volume is noise
max_extension_atr = 3.5   # too far above the EMA = chasing
min_score = 55.0
stop_atr_mult = 2.2
trail_atr_mult = 3.0
breakeven_at_r = 1.0
breakeven_offset_r = 0.1
time_stop_bars = 96       # 4 days on 1h: if it has not worked, release the capital
time_stop_min_r = 0.5
regime_ema = 50
# The market-regime reference as a BASE asset; the pair is completed with the
# quote currency, so kraken/USD reads BTC/USD rather than a USDT pair the venue
# may not even list -- which would silently disable the regime filter.
btc_base = "BTC"
warmup_bars = 250

[risk]
risk_per_trade_pct = 0.5        # of equity, per trade, at the initial stop
max_position_pct = 15.0
max_portfolio_exposure_pct = 60.0
max_open_positions = 6
max_new_entries_per_cycle = 2   # avoid piling into one correlated impulse
daily_loss_limit_pct = 3.0      # halts NEW entries; resets at UTC midnight
max_drawdown_pct = 20.0         # kill switch; does NOT auto-reset
max_correlation = 0.85
correlation_lookback = 168
min_stop_distance_pct = 0.3     # a stop this tight is noise, not a stop

[execution]
starting_equity = 10_000.0
taker_fee_bps = 7.5
maker_fee_bps = 7.5
slippage_bps = 6.0        # modelled cost on normal entries/exits
stop_slippage_bps = 15.0  # stops fill worse; gaps fill at the next open
use_book_spread = true    # cross the real quoted spread when a quote exists
max_spread_bps_entry = 25.0
# NEW ENTRIES FAIL CLOSED on a quote we cannot trust. Missing, invalid, stale,
# malformed or unavailable -> no entry, reason journalled. Exits are exempt:
# an open position must stay manageable whether or not a quote is available.
max_quote_age_s = 90
max_quote_future_skew_s = 30
max_quote_deviation_pct = 10.0
# TIMESTAMP POLICY. Some venues do not stamp their ticker at all; CCXT reports
# that as None. The adapter then stamps it locally and LABELS it, and the entry
# gate SKIPS the age check rather than letting a quote of unknown vintage score
# a meaningless "0 seconds old" -- the price-deviation check above is what
# guards those venues. Run `cli verify-live` to see which case yours is in.
#   require_venue_quote_timestamp = true  -> refuse quotes with no venue stamp
#   quote_ts_fallback = "reject"          -> adapter discards them outright
require_venue_quote_timestamp = false
quote_ts_fallback = "local"
# Position size is computed against the SIMULATED FILL (ask + slippage + tick
# rounding), never the signal candle's close, and re-checked against the fill
# before the position is committed. This is the tolerance on that re-check --
# float noise only, not room for real risk drift.
risk_overshoot_tolerance_pct = 1.0

[safety]
# mode and live_trading_enabled are FORCED to PAPER/false in code.
# Editing them here has no effect -- that is deliberate.
mode = "PAPER"
live_trading_enabled = false
max_data_staleness_s = 900
candle_close_buffer_s = 20   # wait past the close before trusting a candle
max_clock_skew_s = 60
require_btc_data = true      # no BTC reference -> no trading. Fail closed.

[telegram]
enabled = true
heartbeat_minutes = 60
daily_report_hour_utc = 0
stop_update_min_pct = 0.75   # suppress trivial trail nudges
error_cooldown_s = 900       # one failing loop must not spam the chat
timeout_s = 10
max_retries = 3              # transport retries inside a single attempt
# Durable outbox: a deduplicated message is written PENDING before the send and
# only marked SENT once Telegram confirms it, so a failed delivery stays
# recoverable across a restart instead of being silently swallowed.
outbox_lease_s = 120         # how long one in-flight send holds a dedupe key
outbox_max_attempts = 12     # retries before a message is parked as FAILED
outbox_flush_limit = 20      # pending messages replayed per cycle
outbox_retention_days = 30   # how long DELIVERED rows are kept

[engine]
poll_seconds = 30
# Never run cycles back to back. If a cycle takes longer than poll_seconds the
# next one still waits this long, so an overrunning bot slows down instead of
# hammering the exchange. Realised cadence: max(poll_seconds, cycle + this).
min_pause_seconds = 5.0
db_path = "data/crypto_edge.db"
log_dir = "logs"
equity_snapshot_minutes = 15
counterfactual_horizons_h = [1, 4, 12, 24, 48, 168]

[intel]
# News and derivatives ship DISABLED because no provider is wired by default.
# The storage, look-ahead guard and blocking logic are built and tested; you
# supply a provider. See README "Wiring a news provider".
news_enabled = false
news_poll_minutes = 15
news_block_severity = 4
news_block_hours = 24
derivatives_enabled = false
derivatives_poll_minutes = 30
token_event_block_hours = 12
